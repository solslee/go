name: Update weekend events

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 18:00 UTC = 03:00 KST(다음날 새벽)
  workflow_dispatch: {}     # Actions 탭에서 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape events and rebuild index.html
        run: python scrape.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auto-update weekend events"
          git push
